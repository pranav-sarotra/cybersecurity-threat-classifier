app:
  name: "XYZ Company Security Portal"
  version: "3.0.0"
  author: "Pranav Sarotra"
  debug: false

model:
  ml_weight: 0.6
  rule_weight: 0.4
  confidence_threshold: 0.7
  vectorizer:
    max_features: 5000
    ngram_range: [1, 3]
    min_df: 1
    max_df: 0.95
  random_forest:
    n_estimators: 100
    max_depth: 10
    random_state: 42

api_keys:
  virustotal: "8da3265815561b030fb740bbdececc4df5f3b29be3b2d40505e4dcea0d54590f"
  abuseipdb: "214a546f550930edde12c81101545eee68ac8598b0332854915f231bbebc1c36b576d36d6cef59d9"
  shodan: "gMU8afFxPTvcdfnzC0zHEXeVWrqaLq7f"

rate_limits:
  ip_checks_per_minute: 30
  url_checks_per_minute: 20

database:
  path: "data/scan_history.db"

logging:
  level: "INFO"
  file: "logs/security_scanner.log"